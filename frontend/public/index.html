<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPN FIS Chat WebSocket</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Pantalla de Login -->
    <div id="login-screen">
        <div class="card login-card p-4 text-center">
            <h2 class="mb-4" style="color: var(--primary-color);">EPN FIS Chat</h2>
            <div class="mb-3">
                <label for="usernameInput" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="usernameInput" placeholder="Ingresa tu nombre" maxlength="20">
            </div>
            <button id="loginBtn" class="btn btn-epn w-100">Entrar al Chat</button>
        </div>
    </div>

    <!-- Pantalla de Chat -->
    <div id="chat-screen">
        <!-- Header del Chat -->
        <div class="chat-header">
            <h4 class="m-0">FIS Web Chat</h4>
            
            <div class="d-flex align-items-center gap-3">
                <!-- Estado de conexión -->
                <span id="status" class="badge bg-secondary">Conectando...</span>
                
                <!-- Toggle Claro/Oscuro -->
                <div class="form-check form-switch m-0">
                    <input class="form-check-input" type="checkbox" role="switch" id="themeToggle">
                    <label class="form-check-label text-white" for="themeToggle">Oscuro</label>
                </div>
            </div>
        </div>

        <!-- Contenedor de Mensajes -->
        <div id="messages">
            <!-- Los mensajes se agregarán aquí dinámicamente -->
        </div>

        <!-- Área de Input -->
        <div class="chat-input-area">
            <input type="text" id="messageInput" class="form-control" placeholder="Escribe tu mensaje..." maxlength="500">
            <button id="sendBtn" class="btn btn-epn px-4">Enviar</button>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN (opcional para interactividad de Bootstrap si fuera necesaria, pero buena práctica) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
