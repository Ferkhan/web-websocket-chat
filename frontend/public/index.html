<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPN FIS Chat WebSocket</title>
    
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Pantalla de Login -->
    <div id="login-screen">
        <div class="card login-card p-4 text-center" style="max-width: 400px; width: 100%;">
            <h2 class="mb-4" style="color: var(--primary-color);">EPN FIS Chat</h2>
            
            <div id="auth-error" class="alert alert-danger" style="display: none;"></div>

            <!-- Contenedor de Iniciar Sesión -->
            <div id="login-form-container">
                <div class="mb-3 text-start">
                    <label for="loginEmailInput" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="loginEmailInput" placeholder="tu@correo.com">
                </div>
                
                <div class="mb-3 text-start">
                    <label for="loginPasswordInput" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="loginPasswordInput" placeholder="******">
                </div>

                <div class="d-grid gap-2 mb-3">
                    <button id="loginBtn" class="btn btn-epn">Iniciar Sesión</button>
                </div>

                <div class="text-center mb-3">
                    <a href="#" id="showRegisterLink" class="text-decoration-none" style="color: var(--primary-color);">¿No tienes cuenta? Regístrate aquí</a>
                </div>
                
                <hr class="my-3">

                <button id="googleBtn" class="btn btn-danger w-100 d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-google"></i> Entrar con Google
                </button>
            </div>

            <!-- Contenedor de Registro -->
            <div id="register-form-container" style="display: none;">
                <div class="mb-3 text-start">
                    <label for="registerNameInput" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="registerNameInput" placeholder="Tu nombre o apodo">
                </div>

                <div class="mb-3 text-start">
                    <label for="registerEmailInput" class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control" id="registerEmailInput" placeholder="tu@correo.com">
                </div>
                
                <div class="mb-3 text-start">
                    <label for="registerPasswordInput" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="registerPasswordInput" placeholder="******">
                </div>

                <div class="d-grid gap-2 mb-3">
                    <button id="registerBtn" class="btn btn-epn">Crear Cuenta</button>
                </div>

                <div class="text-center">
                    <a href="#" id="showLoginLink" class="text-decoration-none" style="color: var(--primary-color);">¿Ya tienes cuenta? Inicia sesión</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Pantalla de Chat -->
    <div id="chat-screen" style="display: none;">
        <!-- Header del Chat -->
        <div class="chat-header">
            <div class="d-flex align-items-center gap-2">
                <img src="" id="userAvatar" class="rounded-circle" width="40" height="40" alt="Avatar" style="display: none;">
                <h4 class="m-0" id="chatTitle">FIS Web Chat</h4>
            </div>
            
            <div class="d-flex align-items-center gap-3">
                <!-- Botón Logout -->
                <button id="logoutBtn" class="btn btn-outline-danger btn-sm" title="Cerrar sesión">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </button>

                <!-- Estado de conexión -->
                <span id="status" class="badge bg-secondary">Conectando...</span>
                
                <!-- Toggle Claro/Oscuro -->
                <button id="themeToggleBtn" class="btn btn-light rounded-circle d-flex align-items-center justify-content-center shadow-sm border-0" style="width: 40px; height: 40px; padding: 0; font-size: 1.2rem; transition: all 0.3s;" title="Cambiar tema">
                    <i id="themeIcon" class="bi bi-moon-fill" style="color: var(--primary-color);"></i>
                </button>
            </div>
        </div>

        <!-- Contenedor de Mensajes -->
        <div id="messages">
            <!-- Los mensajes se agregarán aquí dinámicamente -->
        </div>

        <!-- Área de Input -->
        <div class="chat-input-area">
            <input type="text" id="messageInput" class="form-control" placeholder="Escribe tu mensaje..." maxlength="500">
            <button id="sendBtn" class="btn btn-epn px-4">Enviar</button>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <!-- Custom JS -->
    <script type="module" src="app.js"></script>
</body>
</html>
